[worldserver]

########################################
# mod-npc-spawn configuration
########################################
#
# This module is driven by the `mod_npc_spawn` table in the WORLD database.
# Each row = one command. To add/retarget/enable/disable a command, edit the
# table, then in-game run `.npcspawn reload` (a worldserver restart is only
# needed when you add a brand-new command NAME).
#
#    NpcSpawn.Enable
#        Description: Master on/off switch for every .npc<helper> command.
#        Default:     1 (enabled)

NpcSpawn.Enable = 1
